---
name: Build main

on:
  push:
    # When merged this should end up being branches: [master] (or,
    # better yet, branches: [main]).
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Built from ./Dockerfile (target: production). Dockerfile.prod is the
    # legacy Ruby 2.6 / nginx-assets build and is no longer used here.
    - uses: docker/build-push-action@v6
      env:
        BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{secrets.GH_PACKAGE_READ_TOKEN}}
      with:
        context: .
        file: ./Dockerfile
        target: production
        platforms: linux/amd64
        push: true
        build-args: |
          RAILS_RELATIVE_URL_ROOT=/m/middle-english-dictionary
        tags: |
          ghcr.io/mlibrary/dromedary/dromedary_unstable_webapp:latest
          ghcr.io/mlibrary/dromedary/dromedary_unstable_webapp:${{ github.sha }}
