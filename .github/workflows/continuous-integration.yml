---
name: Continuous Integration

on:
  workflow_dispatch:  # This allows to kick-off the action manually from GitHub Actions
  push:
  pull_request:

env:
  RAILS_ENV: "test"
  DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/dromedary-test"
  # The app reads SOLR_ROOT + SOLR_COLLECTION (see lib/dromedary/services.rb).
  SOLR_ROOT: "http://127.0.0.1:9172/"
  SOLR_COLLECTION: "med-spec"
  SOLR_PREVIEW_ALIAS: "med-spec"
  SOLR_REPLICATION_FACTOR: "1"
  SOLR_USERNAME: "solr"
  SOLR_PASSWORD: "SolrRocks"
  BUILD_ROOT: "${{ github.workspace }}/tmp/med-spec-build"
  MANUALLY_BUILD_SUGGESTERS: "false"
  # Legacy: indexer/solr_shell.rb still reads this.
  SOLR_URL: "http://127.0.0.1:9172/solr/med-spec"

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.10'
    services:
      db:
        # Keep in sync with compose.yml
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{secrets.GH_PACKAGE_READ_TOKEN}}
      - name: Start SolrCloud
        run: |
          mkdir -p data/solr_index_data
          sudo chown -R 8983:8983 data/solr_index_data
          docker compose up -d zoo
          zookeeper_ready=false
          for attempt in $(seq 1 60); do
            if bash -c '</dev/tcp/127.0.0.1/9091' 2>/dev/null; then
              zookeeper_ready=true
              break
            fi
            sleep 2
          done
          if [ "$zookeeper_ready" != true ]; then
            docker compose logs zoo
            exit 1
          fi
          docker compose up -d solr
          for attempt in $(seq 1 60); do
            if curl -fsS -u solr:SolrRocks http://127.0.0.1:9172/solr/admin/info/system >/dev/null 2>&1; then
              echo "SolrCloud is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs solr zoo
          exit 1
      - name: Setup Database (db:setup)
        run: bundle exec rake db:setup
      # Advisory only: there are existing offenses, so this must not gate merges.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: bundle exec standardrb
      - name: Continuous Integration (spec)
        run: bundle exec rake spec
      - name: Solr integration specs
        env:
          RUN_INTEGRATION: "1"
        run: bundle exec rspec --tag integration
