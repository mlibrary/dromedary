---
name: "Build solr image"

on:
  workflow_dispatch:  # This allows to kick-off the action manually from GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          file: ./solr/Dockerfile
          context: ./solr
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mlibrary/dromedary/dromedary-solr:${{ github.ref_name }}
            ghcr.io/mlibrary/dromedary/dromedary-solr:latest
