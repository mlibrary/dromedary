- name: bibliography_field_author_title
  urls:
    - "http://localhost:3000/bibliography?search_field=bib_author_title&q=chaucer"
    - "http://127.0.0.1:3001/bibliography?search_field=bib_author_title&q=chaucer"
  description: "Fielded bib search: 'Author/Title'"

- name: bibliography_field_external_references
  urls:
    - "http://localhost:3000/bibliography?search_field=bib_external_references&q=IMEV"
    - "http://127.0.0.1:3001/bibliography?search_field=bib_external_references&q=IMEV"
  description: "Fielded bib search: 'External References'"

- name: bibliography_field_lalme
  urls:
    - "http://localhost:3000/bibliography?search_field=bib_lalme&q=Norfolk"
    - "http://127.0.0.1:3001/bibliography?search_field=bib_lalme&q=Norfolk"
  description: "Fielded bib search: 'LALME/LAEME'"

- name: bibliography_field_manuscript
  urls:
    - "http://localhost:3000/bibliography?search_field=bib_manuscript&q=cotton"
    - "http://127.0.0.1:3001/bibliography?search_field=bib_manuscript&q=cotton"
