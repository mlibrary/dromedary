# ---------------------------------------------------------------------------
# Global 404 catch-all (catalog#show404)
# ---------------------------------------------------------------------------

- name: catchall_404
  urls:
    - "http://localhost:3000/this/path/does/not/exist"
    - "http://127.0.0.1:3001/this/path/does/not/exist"
  description: "Global *path catch-all -> catalog#show404"
