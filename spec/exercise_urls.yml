---
# Exercise URL list for dromedary
# Purpose: comprehensive coverage for code-exercise, dead-code detection,
#          and visual regression comparison.
# Hosts: local=http://localhost:3000, reference=http://127.0.0.1:3001
#
# Real document IDs confirmed from data/:
#   MED: MED1882 (apparagen, n.)
#   BIB: BIB1
#   HYP: HYP.1.19990513T124835 -> BIB1

# ---------------------------------------------------------------------------
# Root / Splash
# ---------------------------------------------------------------------------

- name: splash
  urls:
    - "http://localhost:3000/"
    - "http://127.0.0.1:3001/"
  description: "Root splash page; catalog#splash action and landing layout"

# ---------------------------------------------------------------------------
# Dictionary (catalog controller)
# ---------------------------------------------------------------------------

- name: dictionary_home
  urls:
    - "http://localhost:3000/dictionary/"
    - "http://127.0.0.1:3001/dictionary/"
  description: "Catalog home (empty query_string constraint); catalog#home"

- name: dictionary_search_basic
  urls:
    - "http://localhost:3000/dictionary?q=love"
    - "http://127.0.0.1:3001/dictionary?q=love"
  description: "Search results; facets, sort, and result rendering"

- name: dictionary_search_per_page
  urls:
    - "http://localhost:3000/dictionary?q=love&per_page=100"
    - "http://127.0.0.1:3001/dictionary?q=love&per_page=100"
  description: "Per-page variant; pagination controls"

- name: dictionary_search_page2
  urls:
    - "http://localhost:3000/dictionary?q=love&page=2"
    - "http://127.0.0.1:3001/dictionary?q=love&page=2"
  description: "Second page of results; pagination prev/next links"

- name: dictionary_show
  urls:
    - "http://localhost:3000/dictionary/MED1882"
    - "http://127.0.0.1:3001/dictionary/MED1882"
  description: "Show entry (apparagen, n.); document rendering and XSLT transforms"

- name: dictionary_show_404
  urls:
    - "http://localhost:3000/dictionary/MEDXXXXXX"
    - "http://127.0.0.1:3001/dictionary/MEDXXXXXX"
  description: "Invalid MED ID -> catalog#show404; error page rendering"

- name: dictionary_404_wildcard
  urls:
    - "http://localhost:3000/dictionary/some/extra/path"
    - "http://127.0.0.1:3001/dictionary/some/extra/path"
  description: "Wildcard catch-all -> catalog#show404"

# Dictionary search fields (all configured in catalog_controller.rb)
- name: dictionary_field_anywhere
  urls:
    - "http://localhost:3000/dictionary?search_field=anywhere&q=love"
    - "http://127.0.0.1:3001/dictionary?search_field=anywhere&q=love"
  description: "Fielded search: 'Entire entry' (everything_qf edismax)"

- name: dictionary_field_hnf
  urls:
    - "http://localhost:3000/dictionary?search_field=hnf&q=love"
    - "http://127.0.0.1:3001/dictionary?search_field=hnf&q=love"
  description: "Fielded search: 'Headword (with alternate spellings)'"

- name: dictionary_field_notes_and_def
  urls:
    - "http://localhost:3000/dictionary?search_field=notes_and_def&q=love"
    - "http://127.0.0.1:3001/dictionary?search_field=notes_and_def&q=love"
  description: "Fielded search: 'Definition and notes'"

- name: dictionary_field_etyma
  urls:
    - "http://localhost:3000/dictionary?search_field=etyma&q=latin"
    - "http://127.0.0.1:3001/dictionary?search_field=etyma&q=latin"
  description: "Fielded search: 'Etymology'"

- name: dictionary_field_citation
  urls:
    - "http://localhost:3000/dictionary?search_field=citation&q=chaucer"
    - "http://127.0.0.1:3001/dictionary?search_field=citation&q=chaucer"
  description: "Fielded search: 'Associated quotes and manuscripts'"

- name: dictionary_field_oed
  urls:
    - "http://localhost:3000/dictionary?search_field=oed&q=love"
    - "http://127.0.0.1:3001/dictionary?search_field=oed&q=love"
  description: "Fielded search: 'Modern English word equivalent' (oed_norm)"

# Dictionary facet selection
- name: dictionary_facet_pos
  urls:
    - "http://localhost:3000/dictionary?q=love&f[pos][]=noun"
    - "http://127.0.0.1:3001/dictionary?q=love&f[pos][]=noun"
  description: "Facet-filtered results: Part of Speech = noun"

- name: dictionary_facet_language
  urls:
    - "http://localhost:3000/dictionary?q=word&f[etyma_language][]=Latin"
    - "http://127.0.0.1:3001/dictionary?q=word&f[etyma_language][]=Latin"
  description: "Facet-filtered results: Source Language = Latin"

# Suggest / autocomplete (returns HTML <li> fragments)
- name: suggest_h
  urls:
    - "http://localhost:3000/dictionary/suggest?search_field=h&q=lo&base_url=http://localhost:3000"
    - "http://127.0.0.1:3001/dictionary/suggest?search_field=h&q=lo&base_url=http://127.0.0.1:3001"
  description: "Autocomplete fragment: search_field=h (headword_only_suggester)"

- name: suggest_hnf
  urls:
    - "http://localhost:3000/dictionary/suggest?search_field=hnf&q=lo&base_url=http://localhost:3000"
    - "http://127.0.0.1:3001/dictionary/suggest?search_field=hnf&q=lo&base_url=http://127.0.0.1:3001"
  description: "Autocomplete fragment: search_field=hnf (headword_and_forms_suggester)"

- name: suggest_oed
  urls:
    - "http://localhost:3000/dictionary/suggest?search_field=oed&q=lo&base_url=http://localhost:3000"
    - "http://127.0.0.1:3001/dictionary/suggest?search_field=oed&q=lo&base_url=http://127.0.0.1:3001"
  description: "Autocomplete fragment: search_field=oed (oed_suggester)"

# Blacklight /search alias
- name: search_alias
  urls:
    - "http://localhost:3000/search?q=love"
    - "http://127.0.0.1:3001/search?q=love"
  description: "/search alias (Blacklight engine mount) -> catalog#index"

