# Bibliography search fields (all configured in bibliography_controller.rb)
- name: bibliography_field_keyword
  urls:
    - "http://localhost:3000/bibliography?search_field=bib_keyword&q=chaucer"
    - "http://127.0.0.1:3001/bibliography?search_field=bib_keyword&q=chaucer"
